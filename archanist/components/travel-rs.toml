# Component: Travel-RS Telegram bot
# ==================================
# Automated equivalent of the manual upgrade documented in DEPLOYMENT.md:
#   1. Download deploy-v<version>.zip from the GitHub release
#   2. Extract it
#   3. Install Archanist's OWN recipes from the bundle and continue the run
#      with the new travel-rs recipe, so each release deploys with the
#      automation shipped alongside it
#   4. Parse DEPLOYMENT.md and pick the migrations introduced AFTER the
#      currently-deployed version
#   5. Snapshot the DB, then run those migrations
#   6. Sync locale files
#   7. Merge new keys into the active profile
#   8. Refresh Archanist's main config from the bundle
#   9. Pull + recreate the bot container
#
# Runs inside the dockerized Archanist (archanist/docker-compose.yml), which
# needs nothing but its own binary and the mounted docker socket. Component
# tools run in their own images: busybox for the unzip step, and a throwaway
# surrealdb container for migrate/backup/restore that imports into the real DB
# at ${vars.surreal_import_url}.

schema = 1
description = "Travel-RS Bot"

[release]
type = "github"
repo = "PrinceOfBorgo/travel-rs"

# ============================================================================
# OPERATOR KNOBS - all values come from the .env file next to docker-compose.yml.
# Nothing to edit here per deployment: `sync_archanist_recipes` overwrites this
# file on every update, so operator-specific values must live outside git.
# ============================================================================
[vars]
# Host path bind-mounted at /app/data (see docker-compose.yml). The daemon
# resolves bind sources on the host, so any path we hand to a sibling
# container (migrate, swap) has to be this host path, not /app/data.
host_data_dir = "${env.ARCHANIST_HOST_DATA_DIR}"

# Active profile file under config/profiles/, without the .toml.
profile = "${env.TRAVELRS_PROFILE}"

# DB connection - the same env vars the bot's profile uses, so one .env
# feeds both (see config/profiles/prod.toml.example). compose passes them
# in and Archanist errors out if any is missing. TRAVELRS_DB_ADDRESS MUST be
# http/https, NOT ws/wss: the migrate step's export/import go through the
# surreal CLI, which SurrealDB refuses over WebSocket.
surreal_import_url = "${env.TRAVELRS_DB_ADDRESS}"
surreal_user = "${env.TRAVELRS_DB_USERNAME}"
surreal_pass = "${env.TRAVELRS_DB_PASSWORD}"
surreal_ns = "${env.TRAVELRS_DB_NAMESPACE}"
surreal_db = "${env.TRAVELRS_DB_NAME}"

# Image for the throwaway migrate/backup/restore containers - one place so it
# can't drift from the bot's client. release.yml rewrites surreal_version from
# Cargo.toml when it builds the bundle; this literal is the manual-run default.
surreal_version = "2.3.5"
surreal_image = "surrealdb/surrealdb:v${vars.surreal_version}"

# Derived paths - usually no need to touch.
install_dir = "/app/data/travel-rs"                  # container view
install_dir_host = "${vars.host_data_dir}/travel-rs" # host view, for swap mounts

# Archanist's own config sits at the volume root (recipe_sync knows where
# the recipes go).
archanist_config = "/app/data/config.toml"

# Bundle staging inside the volume.
staging_zip = "/app/data/staging/travel-rs-deploy-v${version}.zip"
staging_root = "/app/data/staging/travel-rs-v${version}"
bundle_extracted = "/app/data/staging/travel-rs-v${version}/deploy-v${version}"

# ============================================================================
# Steps (executed in order). Each step's state is persisted, so a failed run
# can be retried (already-applied steps are skipped where safe) and
# `archanist rollback travel-rs` can undo the completed ones in reverse:
# copy/merge steps restore their pre-run backups, swap goes back to the old
# image, and migrate restores the whole-DB snapshot taken before it ran.
# ============================================================================

# Fail fast on a missing .env entry. Step bodies resolve ${env.*} strictly
# while [vars] tolerate gaps, so naming every variable the recipe needs here
# stops the update before anything is downloaded or migrated, instead of
# failing at the step that first uses it. Keep in sync with .env.example.
[[steps]]
id = "check_env"
type = "container_run"
image = "busybox"
command = ["true"]
env = ["ARCHANIST_HOST_DATA_DIR=${env.ARCHANIST_HOST_DATA_DIR}", "TRAVELRS_PROFILE=${env.TRAVELRS_PROFILE}", "TRAVELRS_BOT_TOKEN=${env.TRAVELRS_BOT_TOKEN}", "TRAVELRS_DB_ADDRESS=${env.TRAVELRS_DB_ADDRESS}", "TRAVELRS_DB_USERNAME=${env.TRAVELRS_DB_USERNAME}", "TRAVELRS_DB_PASSWORD=${env.TRAVELRS_DB_PASSWORD}", "TRAVELRS_DB_NAMESPACE=${env.TRAVELRS_DB_NAMESPACE}", "TRAVELRS_DB_NAME=${env.TRAVELRS_DB_NAME}"]

# Grab the release zip.
[[steps]]
id = "download_bundle"
type = "download"
url = "https://github.com/PrinceOfBorgo/travel-rs/releases/download/v${version}/deploy-v${version}.zip"
dest = "${vars.staging_zip}"

# Unzip it in a throwaway busybox - Archanist itself carries no unzip. The
# data volume is mounted at /app/data so the zip/output paths line up.
[[steps]]
id = "extract_bundle"
type = "container_run"
image = "busybox"
binds = ["${vars.host_data_dir}:/app/data"]
command = ["unzip", "-o", "${vars.staging_zip}", "-d", "${vars.staging_root}"]

# Install the bundle's recipes (validated first, so a bad one never lands)
# and continue this run with the new travel-rs.toml: the steps below come
# from the release being deployed.
[[steps]]
id = "sync_archanist_recipes"
type = "recipe_sync"
src = "${vars.bundle_extracted}/archanist/components"
reload = true

# Work out which migrations are new. DEPLOYMENT.md's Migration Reference
# table lists only releases that ship migrations; keep the rows strictly
# newer than the deployed version, drop the ~~struck-through~~ ones, and
# collect the *.surql names.
#
# `version_filter` keeps only table rows whose version is greater than 
# ${current_version}(semver). On a fresh install ${current_version} is
# "(none)" (not semver), so the filter is a no-op and every row is kept.
#
# `section.start` anchors on the table header (not the "## Migration
# Reference" heading) so the intro prose - including an example row-format
# line - is never scanned. `start_after` is kept only as a fallback for
# older Archanist builds that predate `version_filter`.
[[steps]]
id = "select_migrations"
type = "parse_text"
file = "${vars.bundle_extracted}/DEPLOYMENT.md"
section = { start = "^\\|\\s*Version\\s*\\|", start_after = "^\\|\\s*v${current_version}\\s*\\|[^\\n]*\\n", end = "^## " }
version_filter = { pattern = "^\\|\\s*v(?<version>\\d+\\.\\d+\\.\\d+)\\s*\\|", newer_than = "${current_version}" }
strip = ["~~`[^`]+`~~"]
[[steps.extract]]
pattern = "`(?<migrations>[^`]+\\.surql)`"
prefix = "vars."
dedupe = true
sort = true
join = "\n"
# Zero new migrations is a valid outcome (e.g. a release with no schema
# changes), so don't fail the step when nothing matches.
required = false

# Apply them in a throwaway surreal container (Archanist needs no surreal CLI).
# db_migrate creates it through the docker socket; the data volume is bound at
# /app/data so {file} - each not-yet-applied migration - resolves inside it.
[[steps]]
id = "migrate"
type = "db_migrate"
files = "${vars.migrations}"
base = "${vars.bundle_extracted}/database/migrations"
image = "${vars.surreal_image}"
extra_hosts = ["host.docker.internal:host-gateway"]
binds = ["${vars.host_data_dir}:/app/data"]
command = ["import", "--conn", "${vars.surreal_import_url}", "--user", "${vars.surreal_user}", "--pass", "${vars.surreal_pass}", "--ns", "${vars.surreal_ns}", "--db", "${vars.surreal_db}", "{file}"]
# Snapshot the DB before migrating so rollback can restore it - migrations are
# forward-only, there are no down-scripts. {backup} is a per-attempt dir under
# .archanist-backups, on the mounted volume so the container can write it.
backup_command = ["export", "--conn", "${vars.surreal_import_url}", "--user", "${vars.surreal_user}", "--pass", "${vars.surreal_pass}", "--ns", "${vars.surreal_ns}", "--db", "${vars.surreal_db}", "{backup}/pre-migrate.surql"]
# Rollback: patch the dump, drop the DB (reset DDL on stdin), then reimport
# the snapshot - a plain import won't remove objects newer migrations added.
# SurrealDB 2.x exports relation tables' in/out fields as plain DEFINE FIELD,
# which its own import rejects ("field 'in' already exists"), hence OVERWRITE.
[[steps.restore]]
image = "busybox"
command = ["sed", "-i", "-E", "s/^DEFINE FIELD (in|out) ON /DEFINE FIELD OVERWRITE \\1 ON /", "{backup}/pre-migrate.surql"]

[[steps.restore]]
command = ["sql", "--conn", "${vars.surreal_import_url}", "--user", "${vars.surreal_user}", "--pass", "${vars.surreal_pass}", "--ns", "${vars.surreal_ns}"]
stdin = "REMOVE DATABASE IF EXISTS ${vars.surreal_db}; DEFINE DATABASE ${vars.surreal_db};"

[[steps.restore]]
command = ["import", "--conn", "${vars.surreal_import_url}", "--user", "${vars.surreal_user}", "--pass", "${vars.surreal_pass}", "--ns", "${vars.surreal_ns}", "--db", "${vars.surreal_db}", "{backup}/pre-migrate.surql"]

# Refresh locales (adds and overwrites; stale files stay).
[[steps]]
id = "locales"
type = "copy_files"
src = "${vars.bundle_extracted}/locales"
dest = "${vars.install_dir}/locales"

# Pull new keys into the active profile. Heads up: config_merge overwrites
# matching keys rather than only filling gaps, so keep secrets as ${ENV}
# placeholders (prod.toml.example already does) and the merge just adds new
# fields. Backs up the profile for rollback.
[[steps]]
id = "profile_keys"
type = "config_merge"
target = "${vars.install_dir}/config/profiles/${vars.profile}.toml"
patch = "${vars.bundle_extracted}/config/profiles/prod.toml.example"

# Refresh archanist's own config from the bundle (no secrets, plain merge).
[[steps]]
id = "sync_archanist_config"
type = "config_merge"
target = "${vars.archanist_config}"
patch = "${vars.bundle_extracted}/archanist/config.toml"

# Pull the new image and recreate the bot. Volume sources use the host path
# (the daemon resolves them; a container path would mount an empty dir and
# the bot would crash on missing config). `env` feeds the bot token and the
# DB_* placeholders in the profile at runtime. `extra_hosts` maps
# host.docker.internal to the
# host gateway so the bot can reach SurrealDB at ${vars.surreal_url}
[[steps]]
id = "swap"
type = "docker_swap"
image = "ghcr.io/princeofborgo/travel-rs"
tag = "v${version}"
container = "travel-rs"
volumes = ["${vars.install_dir_host}/config:/app/config", "${vars.install_dir_host}/locales:/app/locales", "${vars.install_dir_host}/logs:/app/logs"]
env = ["TRAVELRS_BOT_TOKEN=${env.TRAVELRS_BOT_TOKEN}", "TRAVELRS_DB_ADDRESS=${env.TRAVELRS_DB_ADDRESS}", "TRAVELRS_DB_USERNAME=${env.TRAVELRS_DB_USERNAME}", "TRAVELRS_DB_PASSWORD=${env.TRAVELRS_DB_PASSWORD}", "TRAVELRS_DB_NAMESPACE=${env.TRAVELRS_DB_NAMESPACE}", "TRAVELRS_DB_NAME=${env.TRAVELRS_DB_NAME}"]
extra_hosts = ["host.docker.internal:host-gateway"]
restart_policy = "always"

# ============================================================================
# Sandbox: `archanist sandbox run travel-rs` rehearses the update above
# against a throwaway in-memory SurrealDB and a v0.2.5 baseline, then upgrades
# it to the real latest release - download -> parse DEPLOYMENT.md -> migrate
# only the post-0.2.5 migrations -> sync locales/profile -> swap. Everything
# lands under /app/data/sandbox/travel-rs and the `archanist-sandbox` network;
# `archanist sandbox reset travel-rs` wipes it. Production is never touched:
# the DB/profile/token come from [sandbox.env], paths from [sandbox.vars],
# and the swap targets `travel-rs-sandbox`.
#
# The upgraded bot won't actually run (dummy token) - the sandbox checks the
# pipeline, not a healthy bot. `restart_policy = "no"` keeps it from looping.
# ============================================================================
[sandbox]
# v0.2.5 has no deploy zip, so setup builds the baseline from the git tag.
# Bumping this means reviewing the migration list in `baseline_migrate`.
baseline_version = "0.2.5"
network = "archanist-sandbox"
# Would overwrite the live config with the bundle's copy. (`recipe_sync` is
# safe here: in a sandbox it installs under the sandbox dir and never reloads.)
skip_steps = ["sync_archanist_config"]

# Shadows ${env.*}: the sandbox DB service below and a dummy bot token.
[sandbox.env]
TRAVELRS_PROFILE = "dev-local-docker"
TRAVELRS_BOT_TOKEN = "sandbox-dummy-token"
TRAVELRS_DB_ADDRESS = "http://travel-rs-sandbox-surrealdb:8000"
TRAVELRS_DB_USERNAME = "root"
TRAVELRS_DB_PASSWORD = "root"
TRAVELRS_DB_NAMESPACE = "travel_rs"
TRAVELRS_DB_NAME = "travel_rs_db"

# Redirect every path into the sandbox dir (container view) and its host
# equivalent under ARCHANIST_HOST_DATA_DIR.
[sandbox.vars]
install_dir = "${sandbox.dir}/travel-rs"
install_dir_host = "${vars.host_data_dir}/sandbox/${component}/travel-rs"
staging_zip = "${sandbox.dir}/staging/travel-rs-deploy-v${version}.zip"
staging_root = "${sandbox.dir}/staging/travel-rs-v${version}"
bundle_extracted = "${sandbox.dir}/staging/travel-rs-v${version}/deploy-v${version}"
baseline_zip = "${sandbox.dir}/staging/travel-rs-src-v${sandbox.baseline_version}.zip"
baseline_root = "${sandbox.dir}/staging/baseline"
baseline_tree = "${sandbox.dir}/staging/baseline/travel-rs-${sandbox.baseline_version}"

[sandbox.override.migrate]
network = "${sandbox.network}"

[sandbox.override.swap]
container = "travel-rs-sandbox"
network = "${sandbox.network}"
restart_policy = "no"

# In-memory SurrealDB for the sandbox, reachable by name on the network.
[[sandbox.services]]
name = "travel-rs-sandbox-surrealdb"
image = "${vars.surreal_image}"
command = ["start", "--user", "${env.TRAVELRS_DB_USERNAME}", "--pass", "${env.TRAVELRS_DB_PASSWORD}", "--bind", "0.0.0.0:8000", "memory"]
healthcheck = { test = ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"] }

# The "old" deployment the swap replaces. It only has to exist.
[[sandbox.services]]
name = "travel-rs-sandbox"
image = "ghcr.io/princeofborgo/travel-rs:v${sandbox.baseline_version}"
command = ["sh", "-c", "echo 'travel-rs baseline placeholder; sleeping' && sleep infinity"]

# --- Baseline setup (first `sandbox run` only; ${version} = baseline) ---

[[sandbox.setup]]
id = "baseline_download"
type = "download"
url = "https://github.com/PrinceOfBorgo/travel-rs/archive/refs/tags/v${version}.zip"
dest = "${vars.baseline_zip}"
backup = false

[[sandbox.setup]]
id = "baseline_extract"
type = "container_run"
image = "busybox"
binds = ["${vars.host_data_dir}:/app/data"]
command = ["unzip", "-o", "-q", "${vars.baseline_zip}", "-d", "${vars.baseline_root}"]

# SurrealDB 2.x auto-defines in/out on relation tables, so the old scripts'
# `DEFINE FIELD in|out ON ...` must become `DEFINE FIELD OVERWRITE ...`.
[[sandbox.setup]]
id = "baseline_patch_migrations"
type = "container_run"
image = "busybox"
binds = ["${vars.host_data_dir}:/app/data"]
command = ["sh", "-c", '''sed -i -E 's/DEFINE[[:space:]]+FIELD[[:space:]]+(in|out)[[:space:]]+ON/DEFINE FIELD OVERWRITE \1 ON/I' "$0"/*.surql''', "${vars.baseline_tree}/database/migrations"]

# Migrations cumulative at v0.2.5 per DEPLOYMENT.md.
[[sandbox.setup]]
id = "baseline_migrate"
type = "db_migrate"
files = ["001_init.surql", "002_add_timestamps.surql", "003_define_stats_functions.surql", "004_overwrite_traveler_stats_function.surql", "005_fix_overwrite_stats_function.surql"]
base = "${vars.baseline_tree}/database/migrations"
image = "${vars.surreal_image}"
network = "${sandbox.network}"
binds = ["${vars.host_data_dir}:/app/data"]
command = ["import", "--conn", "${vars.surreal_import_url}", "--user", "${vars.surreal_user}", "--pass", "${vars.surreal_pass}", "--ns", "${vars.surreal_ns}", "--db", "${vars.surreal_db}", "{file}"]

[[sandbox.setup]]
id = "baseline_locales"
type = "copy_files"
src = "${vars.baseline_tree}/locales"
dest = "${vars.install_dir}/locales"
backup = false

[[sandbox.setup]]
id = "baseline_profile"
type = "copy_files"
src = "${vars.baseline_tree}/config/profiles/${vars.profile}.toml"
dest = "${vars.install_dir}/config/profiles/${vars.profile}.toml"
backup = false

[[sandbox.setup]]
id = "baseline_config"
type = "container_run"
image = "busybox"
binds = ["${vars.host_data_dir}:/app/data"]
command = ["sh", "-c", '''printf 'profile = "%s"\n' "$1" > "$0"''', "${vars.install_dir}/config/config.toml", "${vars.profile}"]
