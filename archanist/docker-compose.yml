# Archanist - Travel-RS Bot production deployment (dockerized)
# ============================================================
# Bring this file plus config.toml and components/ to the target host, put
# them next to an `archanist-data/` directory (see README.md), then:
#
#   docker compose run --rm archanist update
#
# The Archanist container drives the host docker daemon through the mounted
# socket to (re)create the bot container and ephemeral migration containers.
#
# This file is not synced by updates, so it is kept generic: per-host values
# live in .env, and new releases only ever need new .env entries.

services:
  archanist:
    image: ${ARCHANIST_IMAGE:-ghcr.io/princeofborgo/archanist}:${ARCHANIST_TAG:-latest}
    container_name: archanist
    # Every run pulls the image first, so updates always run on the newest
    # Archanist (or on ARCHANIST_TAG when pinned in .env). This is how
    # Archanist itself gets updated.
    pull_policy: always
    # Run on demand (`docker compose run --rm archanist update`); the default
    # entrypoint is the Archanist binary. No restart policy: each run is a
    # one-shot command.
    working_dir: /app/data
    command: ["--config", "/app/data/config.toml", "update"]
    # Passes every .env entry to Archanist: the recipes read them as
    # ${env.NAME} for the `migrate` step and the bot container `swap`
    # recreates. Required keys are listed in .env.example; the travel-rs
    # recipe's first step fails the update if any is missing.
    env_file: .env
    volumes:
      # ARCHANIST_HOST_DATA_DIR in .env MUST be the absolute host path this
      # resolves to: the recipes hand it to sibling containers, and the docker
      # daemon resolves bind sources on the host, not inside Archanist.
      - ./archanist-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock