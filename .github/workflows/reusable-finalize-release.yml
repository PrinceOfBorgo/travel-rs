name: Reusable Workflow - Finalize Release

on:
  workflow_call:
    inputs:
      version:
        description: 'The version being released (without v prefix)'
        required: true
        type: string
      cargo_toml_path:
        description: 'Path to Cargo.toml (relative to repo root)'
        required: false
        default: 'Cargo.toml'
        type: string
      changelog_path:
        description: 'Path to CHANGELOG.md (relative to repo root)'
        required: false
        default: 'CHANGELOG.md'
        type: string
      commit_message:
        description: 'Custom commit message for the release commit'
        required: false
        default: 'chore: release version'
        type: string

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release files artifact
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: .

      - name: Set up Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit and Tag Release
        run: |
          git add "${{ inputs.cargo_toml_path }}" "${{ inputs.changelog_path }}" Cargo.lock
          git commit -m "${{ inputs.commit_message }} ${{ inputs.version }} [skip ci]"
          git tag -a "v${{ inputs.version }}" -m "Release version ${{ inputs.version }}"

      - name: Push changes and tags
        run: git push origin main --tags
