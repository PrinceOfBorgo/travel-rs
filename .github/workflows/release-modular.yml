name: Release

on:
  push:
    branches: [ main ]

jobs:
  # Determine release type from commit message
  prepare:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[release:patch]') ||
      contains(github.event.head_commit.message, '[release:fix]') ||
      contains(github.event.head_commit.message, '[release:minor]') ||
      contains(github.event.head_commit.message, '[release:major]')
    
    outputs:
      release_type: ${{ steps.determine_type.outputs.type }}
    
    steps:
      - name: Determine release type
        id: determine_type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[release:major]"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMIT_MSG" == *"[release:minor]"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

  # Job 1: Bump version and update changelog using reusable workflow
  prepare_release_data:
    needs: prepare
    uses: ./.github/workflows/reusable-bump-version.yml
    with:
      release_type: ${{ needs.prepare.outputs.release_type }}
    permissions:
      contents: write

  # Job 2: Build and Push Docker Image (project-specific)
  build_and_push_docker:
    needs: prepare_release_data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            armv7-unknown-linux-musleabihf

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build Binaries
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:v${{ needs.prepare_release_data.outputs.new_version }}
          build-args: |
            BIN_PATH_AMD64=target/x86_64-unknown-linux-musl/release/travel-rs
            BIN_PATH_ARM64=target/aarch64-unknown-linux-musl/release/travel-rs
            BIN_PATH_ARMV7=target/armv7-unknown-linux-musleabihf/release/travel-rs

  # Job 3: Build deploy bundle and prepare for finalization (project-specific)
  prepare_bundle:
    needs: [prepare_release_data, build_and_push_docker]
    runs-on: ubuntu-latest
    outputs:
      bundle_path: ${{ steps.deploy_bundle.outputs.bundle_path }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build deploy bundle
        id: deploy_bundle
        run: |
          NEW_VERSION="${{ needs.prepare_release_data.outputs.new_version }}"
          REPO_LOWER="${{ github.repository_owner }}/${{ github.event.repository.name }}"
          BUNDLE_DIR="deploy-v${NEW_VERSION}"

          mkdir -p "${BUNDLE_DIR}/config/profiles"
          mkdir -p "${BUNDLE_DIR}/database"
          mkdir -p "${BUNDLE_DIR}/locales"

          # --- Version-pinned docker-compose.yml ---
          cat > "${BUNDLE_DIR}/docker-compose.yml" <<EOF
          services:
            travel-rs:
              image: ghcr.io/${REPO_LOWER}:v${NEW_VERSION}
              container_name: travel-rs
              volumes:
                - ./config:/app/config
                - ./locales:/app/locales
                - ./logs:/app/logs
              restart: unless-stopped
          EOF
          # Remove leading whitespace added by heredoc indentation
          sed -i 's/^          //' "${BUNDLE_DIR}/docker-compose.yml"

          # --- Locale files ---
          cp -r locales/* "${BUNDLE_DIR}/locales/"

          # --- Database files ---
          cp database/build_travelers_db.surql "${BUNDLE_DIR}/database/"
          cp -r database/migrations "${BUNDLE_DIR}/database/"

          # --- Config pointing to prod profile ---
          cat > "${BUNDLE_DIR}/config/config.toml" <<'CONFIG_EOF'
          # profile: The name of the configuration profile to use.
          #   This should match one of the profile files in the "profiles" directory (without the .toml extension).
          #   For example, if you have a file named "prod.toml" in the "profiles" directory, you would set this to "prod".
          profile = "prod"
          CONFIG_EOF
          # Remove leading whitespace added by heredoc indentation
          sed -i 's/^          //' "${BUNDLE_DIR}/config/config.toml"

          # --- Sanitized production profile example ---
          cp config/profiles/prod.toml.example "${BUNDLE_DIR}/config/profiles/prod.toml.example"

          # --- Deployment guide ---
          cp DEPLOYMENT.md "${BUNDLE_DIR}/"

          # --- MIGRATIONS.md (new scripts for this release from DEPLOYMENT.md) ---
          # Extract the migration scripts from the DEPLOYMENT.md table row for this version
          DEPLOY_ROW=$(grep -P "^\|\s*v${NEW_VERSION}\s*\|" DEPLOYMENT.md || true)
          MIGRATION_SCRIPTS=$(echo "$DEPLOY_ROW" | grep -oP '\d{3}_[A-Za-z0-9_]+\.surql' | sort -u || true)

          if [ -n "$MIGRATION_SCRIPTS" ]; then
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "The following database migration scripts were introduced in this release."
              echo "Apply them **in order** against your SurrealDB instance before starting the new version."
              echo ""
              echo "$MIGRATION_SCRIPTS" | while IFS= read -r script; do
                echo "- \`${script}\`"
              done
              echo ""
              echo "See [DEPLOYMENT.md](DEPLOYMENT.md#6-migration-reference) for the full migration history."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          else
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "No database migrations are required for this release."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          fi

          # --- Create the zip archive ---
          zip -r "deploy-v${NEW_VERSION}.zip" "${BUNDLE_DIR}"

          echo "bundle_path=deploy-v${NEW_VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "Deploy bundle created: deploy-v${NEW_VERSION}.zip"

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: ${{ steps.deploy_bundle.outputs.bundle_path }}
          retention-days: 1

  # Job 4: Finalize release using reusable workflow
  finalize_release:
    needs: [prepare_release_data, prepare_bundle]
    uses: ./.github/workflows/reusable-finalize-release.yml
    with:
      version: ${{ needs.prepare_release_data.outputs.new_version }}
      changelog_section_heading: ${{ needs.prepare_release_data.outputs.changelog_section_heading }}
    permissions:
      contents: write

  # Job 5: Create GitHub release using reusable workflow
  create_github_release:
    needs: [finalize_release, prepare_release_data, prepare_bundle]
    uses: ./.github/workflows/reusable-create-release.yml
    with:
      version: ${{ needs.prepare_release_data.outputs.new_version }}
      changelog_section_heading: ${{ needs.prepare_release_data.outputs.changelog_section_heading }}
      release_assets: ${{ format('["{0}"]', needs.prepare_bundle.outputs.bundle_path) }}
    permissions:
      contents: write

  # Job 6: Prepare next development iteration (project-specific)
  prepare_next_iteration:
    needs: create_github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: .

      - name: Set up Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump to next snapshot version
        run: |
          # Get the current version components from the *just-released* version
          CURRENT_RELEASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r major minor patch <<< "${CURRENT_RELEASE_VERSION}"

          next_version="${major}.${minor}.$((patch + 1))-SNAPSHOT"

          cargo set-version "${next_version}"
          NEW_SNAPSHOT="## [${next_version}] - Unreleased\n### Added\n- N/A\n\n### Changed\n- N/A\n\n### Fixed\n- N/A"
          sed -i "1s|^# Changelog|# Changelog\n\n${NEW_SNAPSHOT}|" CHANGELOG.md

          git add Cargo.toml CHANGELOG.md Cargo.lock
          git commit -m "chore: prepare for next development iteration [skip ci]"
          git push origin main

  # Job 7: Cleanup on failure
  rollback_on_failure:
    if: failure()
    needs: [prepare_release_data, build_and_push_docker, create_github_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cleanup release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ needs.prepare_release_data.outputs.new_version }}"
          REPO_OWNER="${{ github.repository_owner }}"
          PACKAGE_NAME="${{ github.event.repository.name }}"

          # Delete the GitHub release if it exists
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            gh release delete "v${NEW_VERSION}" --yes || true
          fi

          # Delete the container image if it exists
          if gh api --method GET "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" >/dev/null 2>&1; then
            VERSION_ID=$(gh api "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions" | jq -r ".[] | select(.name == \"v${NEW_VERSION}\") | .id" | head -1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions/$VERSION_ID" || true
            fi
          elif gh api --method GET "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" >/dev/null 2>&1; then
            VERSION_ID=$(gh api "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions" | jq -r ".[] | select(.name == \"v${NEW_VERSION}\") | .id" | head -1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions/$VERSION_ID" || true
            fi
          fi

          echo "Rollback completed"
