name: Release

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Determine release type based on commit message
  determine_release_type:
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/determine-release-type.yml@v2

  # Job 2: Bump version, update changelog
  bump_and_changelog:
    needs: determine_release_type
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/bump-version.yml@v2
    with:
      release_type: ${{ needs.determine_release_type.outputs.release_type }}
    permissions:
      contents: write

  # Job 3: Build and push Docker image (Rust binaries cross-compiled via cargo-zigbuild)
  build_and_push_docker:
    needs: bump_and_changelog
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/docker-build-push.yml@v2
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      cargo_zigbuild: 'true'
      rust_targets: |
        x86_64-unknown-linux-musl
        aarch64-unknown-linux-musl
        armv7-unknown-linux-musleabihf
      build_args: |
        BIN_PATH_AMD64=target/x86_64-unknown-linux-musl/release/travel-rs
        BIN_PATH_ARM64=target/aarch64-unknown-linux-musl/release/travel-rs
        BIN_PATH_ARMV7=target/armv7-unknown-linux-musleabihf/release/travel-rs
    permissions:
      contents: read
      packages: write

  # Job 4: Prepare release bundle
  prepare_bundle:
    needs: [bump_and_changelog, build_and_push_docker]
    runs-on: ubuntu-latest
    outputs:
      bundle_file_name: ${{ steps.deploy_bundle.outputs.bundle_file_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo_lower_case
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build deploy bundle
        id: deploy_bundle
        run: |
          NEW_VERSION="${{ needs.bump_and_changelog.outputs.new_version }}"
          REPO_LOWER="${{ steps.repo_lower_case.outputs.repo_lower }}"
          BUNDLE_DIR="deploy-v${NEW_VERSION}"
          BUNDLE_FILE="deploy-v${NEW_VERSION}.zip"

          mkdir -p "${BUNDLE_DIR}/config/profiles"
          mkdir -p "${BUNDLE_DIR}/database"
          mkdir -p "${BUNDLE_DIR}/locales"

          cat > "${BUNDLE_DIR}/docker-compose.yml" <<EOF
          services:
            travel-rs:
              # Version tag pinned by the release.yml workflow
              image: ghcr.io/${REPO_LOWER}:v${NEW_VERSION}
              container_name: travel-rs
              volumes:
                - ./config:/app/config
                - ./locales:/app/locales
                - ./logs:/app/logs
              restart: always
          EOF
          # Remove leading whitespace added by heredoc indentation
          sed -i 's/^          //' "${BUNDLE_DIR}/docker-compose.yml"

          cp -r locales/* "${BUNDLE_DIR}/locales/"
          cp database/build_travelers_db.surql "${BUNDLE_DIR}/database/"
          cp -r database/migrations "${BUNDLE_DIR}/database/"

          cat > "${BUNDLE_DIR}/config/config.toml" <<'CONFIG_EOF'
          # profile: The name of the configuration profile to use.
          #   This should match one of the profile files in the "profiles" directory (without the .toml extension).
          #   For example, if you have a file named "prod.toml" in the "profiles" directory, you would set this to "prod".
          profile = "prod"
          CONFIG_EOF
          # Remove leading whitespace added by heredoc indentation
          sed -i 's/^          //' "${BUNDLE_DIR}/config/config.toml"

          cp config/profiles/prod.toml.example "${BUNDLE_DIR}/config/profiles/prod.toml.example"
          cp DEPLOYMENT.md "${BUNDLE_DIR}/"

          DEPLOY_ROW=$(grep -P "^\|\s*v${NEW_VERSION}\s*\|" DEPLOYMENT.md || true)
          MIGRATION_SCRIPTS=$(echo "$DEPLOY_ROW" | grep -oP '\d{3}_[A-Za-z0-9_]+\.surql' | sort -u || true)

          if [ -n "$MIGRATION_SCRIPTS" ]; then
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "The following database migration scripts were introduced in this release."
              echo "Apply them **in order** against your SurrealDB instance before starting the new version."
              echo ""
              echo "$MIGRATION_SCRIPTS" | while IFS= read -r script; do
                echo "- \`${script}\`"
              done
              echo ""
              echo "See [DEPLOYMENT.md](DEPLOYMENT.md#6-migration-reference) for the full migration history."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          else
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "No database migrations are required for this release."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          fi

          zip -r "${BUNDLE_FILE}" "${BUNDLE_DIR}"

          echo "bundle_file_name=${BUNDLE_FILE}" >> "$GITHUB_OUTPUT"
          echo "Deploy bundle created: ${BUNDLE_FILE}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: ${{ steps.deploy_bundle.outputs.bundle_file_name }}
          retention-days: 1

  # Job 5: Finalize release - update Cargo.toml, Cargo.lock, CHANGELOG.md
  finalize_release:
    needs: [bump_and_changelog, prepare_bundle]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/finalize-release.yml@v2
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
    permissions:
      contents: write

  # Job 6: Create GitHub release with changelog and bundled assets
  create_github_release:
    needs: [finalize_release, bump_and_changelog, prepare_bundle]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/create-release.yml@v2
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
      changelog_section_heading: ${{ needs.bump_and_changelog.outputs.changelog_section_heading }}
      release_assets: ${{ format('["release-assets/release-bundle/{0}"]', needs.prepare_bundle.outputs.bundle_file_name) }}
    permissions:
      contents: write

  # Job 7: Pin the repo's docker-compose.yml to the just-released version so a
  # plain `docker compose up -d` (or a host reboot with restart: always) never
  # starts an image whose migrations/config/locales aren't deployed yet.
  pin_deploy_compose:
    needs: [bump_and_changelog, finalize_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo_lower_case
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pin docker-compose.yml to the release version
        run: |
          NEW_VERSION="${{ needs.bump_and_changelog.outputs.new_version }}"
          REPO_LOWER="${{ steps.repo_lower_case.outputs.repo_lower }}"
          sed -i -E "s|(image: ghcr\.io/${REPO_LOWER}:).*|\1v${NEW_VERSION}|" docker-compose.yml

      - name: Commit and push
        run: |
          NEW_VERSION="${{ needs.bump_and_changelog.outputs.new_version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- docker-compose.yml; then
            echo "docker-compose.yml already pinned to v${NEW_VERSION}"
            exit 0
          fi
          git add docker-compose.yml
          git commit -m "chore: pin docker-compose.yml to v${NEW_VERSION} [skip ci]"
          git push origin main

  # Job 8: Prepare for next development iteration by bumping to next snapshot version
  prepare_next_iteration:
    needs: [create_github_release, pin_deploy_compose]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/open-next-snapshot.yml@v2
    permissions:
      contents: write

  # Job 9: Rollback release if any of the previous steps fail
  rollback_on_failure:
    if: failure() && needs.bump_and_changelog.outputs.new_version != ''
    needs: [bump_and_changelog, build_and_push_docker, prepare_bundle, finalize_release, create_github_release, pin_deploy_compose, prepare_next_iteration]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/rollback-release.yml@v2
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
      delete_github_release: 'true'
      delete_container_image: 'true'
      delete_tag: 'true'
    permissions:
      contents: write
      packages: write
