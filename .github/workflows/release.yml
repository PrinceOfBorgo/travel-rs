name: Release

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Determine release type based on commit message
  prepare:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[release:patch]') ||
      contains(github.event.head_commit.message, '[release:fix]') ||
      contains(github.event.head_commit.message, '[release:minor]') ||
      contains(github.event.head_commit.message, '[release:major]')
    outputs:
      release_type: ${{ steps.determine_type.outputs.type }}
    steps:
      - name: Determine release type
        id: determine_type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[release:major]"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMIT_MSG" == *"[release:minor]"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Bump version, update changelog
  bump_and_changelog:
    needs: prepare
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/bump-version.yml@v1.0.0
    with:
      release_type: ${{ needs.prepare.outputs.release_type }}
    permissions:
      contents: write

  # Job 3: Build and push Docker image
  build_and_push_docker:
    needs: bump_and_changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lowercase repository name
        id: repo_lower_case
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            armv7-unknown-linux-musleabihf

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binaries
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ steps.repo_lower_case.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.repo_lower_case.outputs.repo_lower }}:v${{ needs.bump_and_changelog.outputs.new_version }}
          build-args: |
            BIN_PATH_AMD64=target/x86_64-unknown-linux-musl/release/travel-rs
            BIN_PATH_ARM64=target/aarch64-unknown-linux-musl/release/travel-rs
            BIN_PATH_ARMV7=target/armv7-unknown-linux-musleabihf/release/travel-rs

  # Job 4: Prepare release bundle
  prepare_bundle:
    needs: [bump_and_changelog, build_and_push_docker]
    runs-on: ubuntu-latest
    outputs:
      bundle_file_name: ${{ steps.deploy_bundle.outputs.bundle_file_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo_lower_case
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build deploy bundle
        id: deploy_bundle
        run: |
          NEW_VERSION="${{ needs.bump_and_changelog.outputs.new_version }}"
          REPO_LOWER="${{ steps.repo_lower_case.outputs.repo_lower }}"
          BUNDLE_DIR="deploy-v${NEW_VERSION}"
          BUNDLE_FILE="deploy-v${NEW_VERSION}.zip"

          mkdir -p "${BUNDLE_DIR}/config/profiles"
          mkdir -p "${BUNDLE_DIR}/database"
          mkdir -p "${BUNDLE_DIR}/locales"

          cat > "${BUNDLE_DIR}/docker-compose.yml" <<EOF
          services:
            travel-rs:
              image: ghcr.io/${REPO_LOWER}:v${NEW_VERSION}
              container_name: travel-rs
              volumes:
                - ./config:/app/config
                - ./locales:/app/locales
                - ./logs:/app/logs
              restart: unless-stopped
          EOF
          sed -i 's/^          //' "${BUNDLE_DIR}/docker-compose.yml"

          cp -r locales/* "${BUNDLE_DIR}/locales/"
          cp database/build_travelers_db.surql "${BUNDLE_DIR}/database/"
          cp -r database/migrations "${BUNDLE_DIR}/database/"

          cat > "${BUNDLE_DIR}/config/config.toml" <<'CONFIG_EOF'
          # profile: The name of the configuration profile to use.
          #   This should match one of the profile files in the "profiles" directory (without the .toml extension).
          #   For example, if you have a file named "prod.toml" in the "profiles" directory, you would set this to "prod".
          profile = "prod"
          CONFIG_EOF
          sed -i 's/^          //' "${BUNDLE_DIR}/config/config.toml"

          cp config/profiles/prod.toml.example "${BUNDLE_DIR}/config/profiles/prod.toml.example"
          cp DEPLOYMENT.md "${BUNDLE_DIR}/"

          DEPLOY_ROW=$(grep -P "^\|\s*v${NEW_VERSION}\s*\|" DEPLOYMENT.md || true)
          MIGRATION_SCRIPTS=$(echo "$DEPLOY_ROW" | grep -oP '\d{3}_[A-Za-z0-9_]+\.surql' | sort -u || true)

          if [ -n "$MIGRATION_SCRIPTS" ]; then
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "The following database migration scripts were introduced in this release."
              echo "Apply them **in order** against your SurrealDB instance before starting the new version."
              echo ""
              echo "$MIGRATION_SCRIPTS" | while IFS= read -r script; do
                echo "- \`${script}\`"
              done
              echo ""
              echo "See [DEPLOYMENT.md](DEPLOYMENT.md#6-migration-reference) for the full migration history."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          else
            {
              echo "# Migrations Required for v${NEW_VERSION}"
              echo ""
              echo "No database migrations are required for this release."
            } > "${BUNDLE_DIR}/MIGRATIONS.md"
          fi

          zip -r "${BUNDLE_FILE}" "${BUNDLE_DIR}"

          echo "bundle_file_name=${BUNDLE_FILE}" >> "$GITHUB_OUTPUT"
          echo "Deploy bundle created: ${BUNDLE_FILE}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: ${{ steps.deploy_bundle.outputs.bundle_file_name }}
          retention-days: 1

  # Job 5: Finalize release - update Cargo.toml, Cargo.lock, CHANGELOG.md
  finalize_release:
    needs: [bump_and_changelog, prepare_bundle]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/finalize-release.yml@v1.0.0
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
    permissions:
      contents: write

  # Job 6: Create GitHub release with changelog and bundled assets
  create_github_release:
    needs: [finalize_release, bump_and_changelog, prepare_bundle]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/create-release.yml@v1.0.0
    with:
      version: ${{ needs.bump_and_changelog.outputs.new_version }}
      changelog_section_heading: ${{ needs.bump_and_changelog.outputs.changelog_section_heading }}
      release_assets: ${{ format('["release-assets/release-bundle/{0}"]', needs.prepare_bundle.outputs.bundle_file_name) }}
    permissions:
      contents: write

  # Job 7: Prepare for next development iteration by bumping to next snapshot version
  prepare_next_iteration:
    needs: create_github_release
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/open-next-snapshot.yml@v1.0.0
    permissions:
      contents: write

  # Job 8: Rollback release if any of the previous steps fail
  rollback_on_failure:
    if: failure()
    needs: [bump_and_changelog, build_and_push_docker, create_github_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Cleanup release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ needs.bump_and_changelog.outputs.new_version }}"
          REPO_OWNER="${{ github.repository_owner }}"
          PACKAGE_NAME="${{ github.event.repository.name }}"

          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            gh release delete "v${NEW_VERSION}" --yes || true
          fi

          if gh api --method GET "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" >/dev/null 2>&1; then
            VERSION_ID=$(gh api "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions" | jq -r ".[] | select(.name == \"v${NEW_VERSION}\") | .id" | head -1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/orgs/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions/$VERSION_ID" || true
            fi
          elif gh api --method GET "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}" >/dev/null 2>&1; then
            VERSION_ID=$(gh api "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions" | jq -r ".[] | select(.name == \"v${NEW_VERSION}\") | .id" | head -1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/users/${REPO_OWNER}/packages/container/${PACKAGE_NAME}/versions/$VERSION_ID" || true
            fi
          fi

          echo "Rollback completed"
